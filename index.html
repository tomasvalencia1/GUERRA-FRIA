<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f3366">
<title>Guerra Fría: La Gran Misión</title>
<meta name="description" content="Juego educativo: aprende la Guerra Fría (1945–1991) como agente secreto, con 8 misiones, mini-juegos, examen final y diploma.">
<meta property="og:title" content="Guerra Fría: La Gran Misión">
<meta property="og:description" content="Aprende la Guerra Fría como agente secreto: 8 misiones, mini-juegos, examen final y diploma.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3eee3;--bg2:#e9e0cd;--card:#fffdf8;--ink:#1f1b16;--mut:#6d6457;--line:#e3d9c5;--line2:#cbbd9f;--pri:#2f4a8a;--pri2:#1f3366;--on:#fff;--red:#c0392b;--blue:#2f5fb8;--acc:#e0a526;--acc2:#b98512;--ok:#2e7d4f;--okbg:#e2f2e7;--bad:#c0392b;--badbg:#f9e3df;--st1:#0e1830;--st2:#22386e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1120;--bg2:#141d35;--card:#151d31;--ink:#ece6da;--mut:#9ba3b9;--line:#253050;--line2:#34426a;--pri:#7b98e8;--pri2:#4f6dc4;--on:#0b1020;--red:#ff6f61;--blue:#6f9bff;--acc:#f2b84b;--acc2:#c98f1a;--ok:#5fd394;--okbg:#14301f;--bad:#ff7a6b;--badbg:#3a1d1c;--st1:#070c1a;--st2:#17264d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c1120;--bg2:#141d35;--card:#151d31;--ink:#ece6da;--mut:#9ba3b9;--line:#253050;--line2:#34426a;--pri:#7b98e8;--pri2:#4f6dc4;--on:#0b1020;--red:#ff6f61;--blue:#6f9bff;--acc:#f2b84b;--acc2:#c98f1a;--ok:#5fd394;--okbg:#14301f;--bad:#ff7a6b;--badbg:#3a1d1c;--st1:#070c1a;--st2:#17264d;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 50% -120px,var(--bg2),transparent 70%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:640px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom))}
:where(#app)>*{animation:in .35s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1{font-size:2rem;line-height:1.1;margin:.15em 0;font-weight:900;letter-spacing:-.01em}
.q{font-size:1.15rem;line-height:1.35;margin:.7em 0 .4em;font-weight:800}
.mut{color:var(--mut);font-size:.92rem}
.c{text-align:center}.w100{width:100%}
.kicker{font-family:"Special Elite","Courier New",monospace;text-transform:uppercase;letter-spacing:.12em;font-size:.76rem;color:var(--mut)}
.kicker.light{color:rgba(255,255,255,.72)}
.stamp{display:inline-block;font-family:"Special Elite","Courier New",monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--red);border:3px double var(--red);border-radius:6px;padding:3px 10px;transform:rotate(-7deg);opacity:.92;font-size:.95rem;white-space:nowrap}
.stamp.sm{font-size:.66rem;padding:1px 7px;border-width:2px;float:right;margin:0 0 6px 8px}
.stamp.big{font-size:1.3rem;padding:6px 16px}
.stamp.in{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-7deg) scale(2.4);opacity:0}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:14px 0;box-shadow:0 1px 0 var(--line2),0 10px 24px -20px rgba(0,0,0,.4)}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-weight:800;font-size:.88rem;white-space:nowrap}
.bar{height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--acc);border-radius:9px;transition:width .6s}
/* botones */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;padding:12px 16px;margin:10px 0;border:0;border-radius:14px;background:var(--pri);color:var(--on);font-weight:800;font-size:1rem;box-shadow:0 3px 0 var(--pri2);transition:transform .08s,box-shadow .08s,opacity .15s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--pri2)}
.btn:disabled{opacity:.5}
.btn.acc{background:var(--acc);color:#1f1b16;box-shadow:0 3px 0 var(--acc2)}
.btn.red{background:var(--red);box-shadow:0 3px 0 color-mix(in srgb,var(--red),#000 32%)}
.btn.blue{background:var(--blue);box-shadow:0 3px 0 color-mix(in srgb,var(--blue),#000 32%)}
.btn.green{background:var(--ok);box-shadow:0 3px 0 color-mix(in srgb,var(--ok),#000 32%)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.btn.sq{width:52px;flex:none;margin:0;font-size:1.4rem;padding:0}
.btn.big{min-height:60px;font-size:1.1rem}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 14px;margin:8px 0;min-height:54px;font-weight:700;transition:border-color .15s,background .15s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--line2)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .lt{flex:none;width:28px;height:28px;border-radius:8px;background:var(--line);display:grid;place-items:center;font-weight:900;font-size:.85rem}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.ok .lt{background:var(--ok);color:var(--on)}
.opt.no{border-color:var(--bad);background:var(--badbg)}.opt.no .lt{background:var(--bad);color:var(--on)}
.opt:disabled:not(.ok):not(.no){opacity:.55}
.sh{animation:sk .32s!important}
@keyframes sk{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.dossier{position:relative;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:14px;padding:12px 14px;margin:12px 0;min-height:52px}
.dossier p{margin:.2em 0}
.dossier .btn{margin-bottom:2px}
.dz-h{font-weight:900;font-size:1.1rem;margin-bottom:2px}
/* barra superior */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;margin:0 -16px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.g{flex:none;width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:1.2rem;display:grid;place-items:center;padding:0}
.tt{flex:1;min-width:0;line-height:1.2}.tt small{display:block;color:var(--mut);font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em}.tt b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:5px;margin:4px 0 2px}.segs i{flex:1;height:7px;border-radius:9px;background:var(--line);transition:background .3s}.segs i.d{background:var(--pri)}.segs i.c{background:var(--acc)}
/* agente */
.say{display:flex;gap:10px;align-items:flex-start;margin:14px 0}
.av{flex:none;width:54px;height:54px;border-radius:50%;display:block;box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--line2),0 6px 14px -6px rgba(0,0,0,.5)}
.av svg{display:block;width:100%;height:100%}
.flag{display:inline-block;width:1.45em;height:1em;vertical-align:-.12em;border-radius:.14em;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.av .head{animation:bob 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.av .mouth{transform-box:fill-box;transform-origin:50% 30%}
.av.talk .mouth{animation:talk .16s ease-in-out infinite alternate}
.av .shine{animation:shine 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1px) rotate(-2deg)}}
@keyframes talk{to{transform:scaleY(2.1)}}
@keyframes shine{0%,70%{opacity:0;transform:translateX(-4px)}80%{opacity:.9}100%{opacity:0;transform:translateX(5px)}}
.av.lg{width:110px;height:110px;margin:6px auto 0;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--line2),0 14px 30px -12px rgba(0,0,0,.55)}
.bub{position:relative;flex:1;background:var(--card);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:11px 48px 11px 14px}
.bub p{margin:0;font-weight:600}
.spk{position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:10px;border:0;background:var(--line);font-size:1rem;padding:0}
.tw::after{content:"▍";opacity:.5}
/* escenario */
.stage{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,var(--st2),var(--st1));border-radius:22px;min-height:170px;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:12px;padding:18px;color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.stage::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.stage>*{position:relative}
.stage.sm{min-height:92px;padding:12px}
.em{font-size:3.2rem;line-height:1}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
/* puntos calientes */
.hsw{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.hs{position:relative;width:84px;height:84px;border-radius:18px;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;animation:pl 1.6s ease-in-out infinite}
.hs span{font-size:2.1rem;line-height:1}
.hs small{font-size:.66rem;font-weight:800;line-height:1.1;padding:0 4px}
.hs.s{animation:none;background:rgba(95,211,148,.2);border-color:#5fd394}
.hs.s::after{content:"✓";position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:#5fd394;color:#0c1120;font-size:.8rem;font-weight:900;display:grid;place-items:center}
.hs.on{box-shadow:0 0 0 3px var(--acc)}
@keyframes pl{50%{transform:scale(1.07)}}
.map{position:relative;width:100%;height:270px;border-radius:14px;overflow:hidden;background:linear-gradient(90deg,rgba(111,155,255,.17) 50%,rgba(255,111,97,.17) 50%)}
.map::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px dashed rgba(255,255,255,.35)}
.map-w,.map-e{position:absolute;top:8px;font-family:"Special Elite",monospace;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;opacity:.8}
.map-w{left:10px}.map-e{right:10px}
.radar{position:absolute;inset:-60%;background:conic-gradient(from 0deg,rgba(120,255,170,.2),transparent 16%);animation:spin 5s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.map .hs{position:absolute;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);animation:pm 1.6s ease-in-out infinite;z-index:1}
.map .hs span{font-size:1.45rem}.map .hs small{font-size:.54rem}
.map .hs.s{animation:none}
@keyframes pm{50%{transform:translate(-50%,-50%) scale(1.1)}}
/* línea de tiempo */
.tl-stage{display:flex;align-items:center;gap:18px}
.yr{font-size:3rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.track{position:relative;margin-top:14px;padding-top:14px}
.ticks{position:absolute;left:13px;right:13px;top:0;height:12px;pointer-events:none}
.ticks i{position:absolute;top:0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--line2);transform:translateX(-50%);transition:border-color .3s}
.ticks i.on{border-top-color:var(--acc)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:9px;background:var(--line)}
input[type=range]::-moz-range-track{height:10px;border-radius:9px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--pri);border:4px solid var(--card);box-shadow:0 1px 5px rgba(0,0,0,.35);margin-top:-9px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--pri);border:4px solid var(--card);box-shadow:0 1px 5px rgba(0,0,0,.35)}
.tl-lab{display:flex;justify-content:space-between;font-weight:800;font-size:.85rem}
.log{list-style:none;padding:0;margin:12px 0 0;display:flex;flex-direction:column;gap:6px}
.log li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-size:.9rem;animation:in .3s}
.log li b{color:var(--pri);margin-right:4px}
/* muro */
.wall{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;width:100%;padding:6px;border-bottom:4px solid rgba(255,255,255,.4)}
.wall b{height:26px;border-radius:4px;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.18)}
.wall b.on{background:#b4553a;border:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);animation:drop .25s cubic-bezier(.2,1.4,.4,1)}
.wall b.fall{background:#b4553a;border:0;animation:fall .7s ease-in forwards}
.wall b.gone{visibility:hidden}
@keyframes drop{from{transform:translateY(-30px);opacity:0}}
@keyframes fall{to{transform:translateY(90px) rotate(35deg);opacity:0}}
.wire{height:12px;margin:0 6px 2px;background:repeating-linear-gradient(90deg,#cfd6e6 0 2px,transparent 2px 9px),linear-gradient(transparent 5px,#cfd6e6 5px 7px,transparent 7px);opacity:0;transition:opacity .4s}
.wire.on{opacity:.85}
.wall-lab{display:flex;justify-content:space-between;font-size:.82rem;margin-top:8px;opacity:.9}
.crowd{text-align:center;font-size:1.6rem;min-height:2.3rem;margin-bottom:4px;letter-spacing:2px}
/* crisis */
.defcon{display:inline-block;font-family:"Special Elite",monospace;font-size:1rem;letter-spacing:.1em;padding:5px 14px;border-radius:10px;margin-bottom:16px;transition:background .3s,color .3s}
.defcon b{font-size:1.4rem;margin-left:4px}
.defcon.d1{background:#f2f2f2;color:#111;animation:alarm .5s infinite alternate}
.defcon.d2{background:#d63a2f;color:#fff}.defcon.d3{background:#f2c230;color:#1f1b16}.defcon.d4{background:#2e9d5b;color:#fff}.defcon.d5{background:#2f6fd6;color:#fff}
@keyframes alarm{to{background:#ff4d4d;color:#fff}}
.mt{position:relative;width:100%;height:20px;border-radius:12px;background:linear-gradient(90deg,#3fbf73,#f2c230 50%,#e2453a)}
.mt div{position:absolute;top:-11px;font-size:1.7rem;transform:translateX(-50%);transition:left .6s cubic-bezier(.2,1.3,.4,1)}
.mt-lab{display:flex;justify-content:space-between;font-size:.75rem;margin-top:8px;opacity:.85;font-weight:700}
/* tarjetas */
.sw-wrap{display:flex;align-items:center;gap:8px;width:100%}
.sw-side{flex:none;width:34px;text-align:center;font-size:.8rem;font-weight:800;opacity:.8;line-height:1.2}
.cd{flex:1;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:20px;padding:22px 14px;font-size:1.15rem;font-weight:800;text-align:center;min-height:110px;display:flex;align-items:center;justify-content:center;touch-action:pan-y;transition:transform .2s,border-color .15s;box-shadow:0 12px 26px -12px rgba(0,0,0,.6);cursor:grab}
.cd.static{cursor:default}
.cd.drag{transition:none;cursor:grabbing}
.cd[data-tilt=l]{border-color:var(--blue)}.cd[data-tilt=r]{border-color:var(--red)}
.cd.in{animation:cin .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes cin{from{transform:scale(.85);opacity:0}}
.cd.outL{animation:outL .35s forwards}.cd.outR{animation:outR .35s forwards}
@keyframes outL{to{transform:translateX(-130%) rotate(-18deg);opacity:0}}
@keyframes outR{to{transform:translateX(130%) rotate(18deg);opacity:0}}
.sw{display:flex;gap:10px}.sw .btn{margin:8px 0 2px}
.sw-count{width:100%;text-align:center;font-size:.8rem;opacity:.75}
.timer{height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:12px}.timer i{display:block;height:100%;width:100%;background:var(--acc)}
/* cohete */
.sky{position:relative;width:100%;height:170px;overflow:hidden;border-radius:14px}
.starfield{position:absolute;inset:0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1px 1px at 70% 20%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 72%,#fff,transparent),radial-gradient(1px 1px at 86% 58%,#fff,transparent),radial-gradient(1px 1px at 10% 80%,#fff,transparent),radial-gradient(1.5px 1.5px at 58% 42%,#fff,transparent),radial-gradient(1px 1px at 30% 12%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 14%,#fff,transparent);opacity:.85}
.rocket{position:absolute;left:50%;bottom:16px;font-size:3.2rem;line-height:1;transform:translateX(-50%) rotate(-45deg);transition:transform 1.8s cubic-bezier(.5,0,.8,.2)}
.rocket.go{transform:translateX(-50%) translateY(-260px) rotate(-45deg)}
.pad{position:absolute;left:0;right:0;bottom:0;height:14px;background:rgba(255,255,255,.14)}
.cdn{position:absolute;top:10px;left:0;right:0;text-align:center;font-size:2.2rem;font-weight:900}
.nl{position:relative;width:100%;height:22px;border-radius:11px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:12px}
.nl .z{position:absolute;left:38%;width:24%;height:100%;background:#3fbf73}
.nl .p{position:absolute;top:0;width:6px;height:100%;background:#fff;transform:translateX(-50%);box-shadow:0 0 8px #fff}
/* cifrado */
.cipher{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 14px;margin:12px 0 4px}
.cipher .w{display:inline-flex;gap:3px}
.cipher i{font-style:normal;width:24px;height:34px;display:grid;place-items:center;background:rgba(255,255,255,.1);border-radius:6px;font-family:"Special Elite","Courier New",monospace;font-size:1.25rem}
.cipher.solved i{background:rgba(95,211,148,.32);animation:pop .3s both}
.dial{display:flex;gap:10px;align-items:center}
/* orden */
.slots{list-style:none;margin:0;padding:0;width:100%;display:flex;flex-direction:column;gap:6px}
.slot{display:flex;align-items:center;gap:10px;border:2px dashed rgba(255,255,255,.25);border-radius:12px;padding:5px 10px;min-height:38px;font-size:.92rem}
.slot .sn{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.15);display:grid;place-items:center;font-weight:900;font-size:.8rem}
.slot .sv{opacity:.45}
.slot.on{border-style:solid;border-color:#5fd394;background:rgba(95,211,148,.14);animation:pop .3s}
.slot.on .sv{opacity:1}.slot.on .sn{background:#5fd394;color:#0c1120}
/* parejas */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mcol{display:flex;flex-direction:column;gap:8px}
.pr{flex:1 0 auto;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;font-size:.88rem;font-weight:700;text-align:left;min-height:58px;line-height:1.3;transition:border-color .15s,background .15s,transform .1s,opacity .2s}
.pr.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--card));transform:scale(1.02)}
.pr.ok{border-color:var(--ok);background:var(--okbg);opacity:.7}
.mprog{height:8px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:12px;width:100%}.mprog i{display:block;height:100%;width:0;background:#5fd394;transition:width .4s}
.nx{display:block;width:100%;margin-top:14px;min-height:56px;padding:14px;border-radius:14px;border:0;background:var(--line);color:var(--mut);font-weight:900;font-size:1.05rem}
.nx.rdy{background:var(--acc);color:#1f1b16;box-shadow:0 3px 0 var(--acc2);animation:pl 1s ease-in-out 3}
/* inicio */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:8px}
.hero h1{font-size:2.2rem}
.agent-row{display:flex;gap:14px;align-items:center}
.badge{flex:none;width:58px;height:58px;border-radius:16px;background:var(--ink);display:grid;place-items:center;font-size:2rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--bg);border-radius:12px;padding:8px 4px;text-align:center}
.stats b{display:block;font-size:1.1rem;font-weight:900}.stats span{font-size:.74rem;color:var(--mut);font-weight:700}
.medals{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.md{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:1.35rem;display:grid;place-items:center;padding:0}
.md.off{filter:grayscale(1);opacity:.35}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 2px}
.sec-h h2{margin:0;font-size:1.2rem;font-weight:900}
.path{position:relative;display:flex;flex-direction:column;gap:12px;margin:10px 0}
.path::before{content:"";position:absolute;left:34px;top:24px;bottom:24px;width:4px;border-radius:4px;background:var(--line2)}
.nd{position:relative;display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px 10px 10px;box-shadow:0 1px 0 var(--line2);transition:transform .1s}
.nd:active:not(:disabled){transform:scale(.99)}
.nd:disabled{opacity:.6}
.nd .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--bg2);border:3px solid var(--card);box-shadow:0 0 0 2px var(--line2);display:grid;place-items:center;font-size:1.55rem}
.nd.dn .ic{background:var(--acc);box-shadow:0 0 0 2px var(--acc2)}
.nd.nx1{border:2px solid var(--acc)}
.nd.nx1 .ic{animation:pl 1.6s ease-in-out infinite;background:var(--pri);box-shadow:0 0 0 2px var(--pri2)}
.nd-t{flex:1;min-width:0}.nd-t small{display:block;font-size:.7rem;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.05em}.nd-t b{display:block;font-size:1.02rem;line-height:1.25}
.nd .arr{flex:none;font-weight:900;color:var(--mut)}
.ss{color:var(--acc2);letter-spacing:1px;font-weight:900}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;font-size:1.6rem;box-shadow:0 1px 0 var(--line2)}
.tile b{font-size:1rem;line-height:1.2}.tile span{font-size:.8rem;color:var(--mut);font-weight:700;line-height:1.3}
.tile:disabled{opacity:.55}
.foot{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;margin-top:18px}
.lnk{background:none;border:0;color:var(--mut);font-size:.86rem;font-weight:700;padding:9px 11px;border-radius:10px}
.lnk:hover{background:var(--line)}
/* intro */
.intro{padding-top:6vh}
.folder{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px 22px 22px 22px;padding:30px 20px 22px;box-shadow:0 22px 44px -26px rgba(0,0,0,.5);text-align:center;margin-top:20px}
.folder::before{content:"";position:absolute;top:-19px;left:-1px;width:130px;height:20px;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0}
.folder .stamp{position:absolute;top:-16px;right:12px;background:var(--card)}
.big-ic{font-size:4rem;margin:8px 0 0;line-height:1.1}
#brief{text-align:left;font-weight:600;min-height:7.5em;margin:14px 0}
.lbl{display:block;text-align:left;font-weight:800;font-size:.85rem;margin-top:6px}
.inp{width:100%;min-height:48px;margin-top:6px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-weight:700}
.inp:focus{outline:none;border-color:var(--pri)}
/* final de misión */
.fin{text-align:center;padding-top:3vh}
.medal-big{font-size:4.5rem;margin:14px 0 0;line-height:1.1;animation:pop .5s .2s both}
.stars{font-size:2.6rem;letter-spacing:6px;margin:2px 0;line-height:1.2}
.stars span{color:var(--line2);display:inline-block}
.stars span.on{color:var(--acc);animation:pop .4s both}
.learn{text-align:left;margin:8px 0 0;padding-left:1.2em}.learn li{margin:7px 0}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.row3 b{display:block;font-size:1.05rem;line-height:1.25}.row3 span{font-size:.74rem;color:var(--mut);font-weight:700}
.hl{border:2px solid var(--acc)}
.score{text-align:left}
.sc-row{display:flex;align-items:center;gap:16px;margin-top:8px}
.grade{flex:none;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:"Special Elite","Courier New",monospace;font-size:3rem;line-height:1;box-shadow:0 0 0 4px var(--card),0 0 0 6px var(--line2);animation:stamp .5s 1.4s cubic-bezier(.2,1.6,.4,1) both}
.sc-n b{display:block;font-size:2.8rem;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sc-n span{color:var(--mut);font-weight:700;font-size:.9rem}
.big-bar{height:14px;margin-top:16px}.big-bar i{transition:none}
.sc-g{margin-top:8px;font-size:.95rem}
.sr{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.kicker+.sr{margin-top:8px}
.sr-i{flex:none;width:36px;height:36px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:1.15rem}
.sr-n{flex:1;min-width:0}.sr-n b{display:block;font-size:.95rem;line-height:1.25}.sr-n small{color:var(--mut);font-size:.8rem;font-weight:700}
.sr-p{flex:none;font-weight:900;font-variant-numeric:tabular-nums;text-align:right}.sr-p small{color:var(--mut);font-weight:700}
/* archivo */
.cx summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none;gap:8px}
.cx summary::-webkit-details-marker{display:none}
.cx-i{display:flex;gap:12px;padding:12px 0 2px;border-top:1px dashed var(--line);margin-top:10px}
.cx-ic{flex:none;width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center;font-size:1.3rem}
.cx-i p{margin:2px 0 0;font-size:.92rem}
.cx-i>div{flex:1}
.rd{display:block;height:11px;border-radius:3px;background:var(--ink);opacity:.75;margin:6px 0}
/* diploma */
.cert{background:#fbf6ea;color:#2a241b;border-radius:10px;padding:10px;margin:14px 0;box-shadow:0 12px 30px -16px rgba(0,0,0,.55)}
.cert-in{position:relative;border:3px double #8a6d3b;border-radius:6px;padding:30px 16px 22px;text-align:center}
.cert .stamp{position:absolute;top:-14px;right:8px;color:#b0362a;border-color:#b0362a;font-size:.75rem;background:#fbf6ea}
.cert .kicker{color:#6d5a3a}
.cert h2{font-family:"Special Elite",monospace;font-size:1.7rem;margin:.2em 0 .5em;letter-spacing:.04em}
.cert p{margin:.3em 0}
.cert-n{font-size:1.7rem;font-weight:900;border-bottom:2px solid #8a6d3b;display:inline-block;padding:0 12px 2px;margin:4px 0 10px;min-width:60%;word-break:break-word}
.cert-r{font-size:1.25rem;font-weight:900;color:#2f4a8a;margin:6px 0 12px}
.cert-f{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 14px;font-weight:800;font-size:.9rem}
.cert-d{margin-top:14px;font-family:"Special Elite",monospace;font-size:.85rem;color:#6d5a3a}
/* efectos */
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:20;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:800;font-size:.92rem;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);animation:tin .35s cubic-bezier(.2,1.4,.4,1);text-align:center}
.toast.big{background:var(--acc);color:#1f1b16}
.toast.out{animation:tout .3s forwards}
@keyframes tin{from{transform:translateY(20px);opacity:0}}@keyframes tout{to{transform:translateY(10px);opacity:0}}
.fl{position:fixed;z-index:30;font-weight:900;font-size:1.05rem;color:var(--acc);text-shadow:0 1px 0 rgba(0,0,0,.3);pointer-events:none;transform:translate(-50%,-50%);animation:up 1s ease-out forwards}
@keyframes up{to{transform:translate(-50%,calc(-50% - 60px));opacity:0}}
.cf{position:fixed;top:-24px;z-index:25;pointer-events:none;animation:fa 2.6s linear forwards}
@keyframes fa{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}
@media print{body{background:#fff}body *{visibility:hidden}#cert,#cert *{visibility:visible}#cert{position:absolute;left:0;top:0;width:100%;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toasts" role="status" aria-live="polite"></div>

<script>
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const app=$("#app"),RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
const fresh=()=>({xp:0,done:{},st:{},er:{},tm:{},files:{},medals:{},fq:0,intro:0,snd:1,theme:"",dy:0,ld:"",exam:0,ex1:0,name:""});
let S=fresh(),cur=null,TM=[],EXI=0;
try{const raw=localStorage.getItem("gf3");if(raw)Object.assign(S,JSON.parse(raw));else{const o=JSON.parse(localStorage.getItem("gf2")||"null");if(o)Object.assign(S,{xp:o.xp||0,done:o.done||{},st:o.st||{},fq:o.fq||0,intro:o.intro||0,dy:o.dy||0,ld:o.ld||""})}}catch(e){}
function save(){try{localStorage.setItem("gf3",JSON.stringify(S))}catch(e){}}
if(S.theme)document.documentElement.dataset.theme=S.theme;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============ CONTENIDO ============ */
const M=[
{id:1,ic:"🌍",n:"El mundo se parte en dos",y:"1945–1955",
 learn:["Tras 1945 quedaron dos superpotencias: EE.UU. (capitalismo) y la URSS (comunismo).","Se llamó «fría» porque nunca se atacaron de frente: el miedo nuclear lo impedía.","El mundo se dividió en bloques: la OTAN (1949) y el Pacto de Varsovia (1955)."],
 sc:[
 {k:"hot",say:"Terminó la Segunda Guerra Mundial (1945). Solo quedaron dos gigantes. Toca cada uno para abrir su archivo.",h:[["🇺🇸","EE.UU.","Capitalismo: empresas privadas y libre mercado. Democracia con varios partidos."],["🇷🇺","URSS","Comunismo: el Estado controla la economía. Un solo partido, el Comunista."],["💣","El miedo","Ambos tenían bomba atómica. Si peleaban de frente, todos perdían. Por eso fue «fría»: sin choque directo."]]},
 {k:"time",say:"Desliza la línea de tiempo y mira cómo el mundo se divide en bandos.",min:1945,max:1955,ev:[[1945,"🏳️","Termina la Segunda Guerra Mundial."],[1947,"📜","Doctrina Truman: EE.UU. promete apoyar a quien resista al comunismo."],[1949,"🛡️","Nace la OTAN: alianza militar de EE.UU. y países occidentales."],[1955,"⚔️","Nace el Pacto de Varsovia, la respuesta soviética. ¡Dos bandos listos!"]]},
 {k:"swipe",say:"Misión de campo: arrastra cada tarjeta hacia su bando (o usa los botones).",i:[["Libre mercado",0,"Es la base del capitalismo.","la economía la mueven empresas privadas"],["Economía planificada por el Estado",1,"Modelo comunista soviético.","el Estado decide qué se produce"],["OTAN",0,"Alianza creada en 1949.","es la alianza de Occidente"],["Pacto de Varsovia",1,"Respuesta soviética a la OTAN (1955).","nació como respuesta a la OTAN"],["Partido único",1,"En la URSS solo existía el Partido Comunista.","no había varios partidos"],["Doctrina Truman",0,"EE.UU. apoyaba a países que resistían al comunismo.","Truman fue presidente de EE.UU."]]},
 {k:"quiz",say:"Mini-reto: una sola pregunta. Sin presión, puedes reintentar.",p:"¿Por qué se llama «Guerra Fría»?",o:["Porque EE.UU. y la URSS nunca se atacaron directamente","Porque se peleó en el Polo Norte","Porque hacía mucho frío en Moscú"],c:0,hint:"Pista: las dos potencias tenían bombas atómicas…",e:"Se enfrentaban con espionaje, propaganda y guerras de terceros, no cara a cara."}]},
{id:2,ic:"🧱",n:"Berlín y el Muro",y:"1948–1961",
 learn:["Alemania y su capital, Berlín, quedaron divididas en zonas tras la guerra.","Con el puente aéreo (1948–49), los aliados salvaron a Berlín Occidental del bloqueo soviético.","En 1961 se levantó el Muro para impedir que la gente huyera al Oeste."],
 sc:[
 {k:"hot",say:"Alemania quedó repartida entre los vencedores. Berlín, dentro de la zona soviética, también. Explora.",h:[["🗺️","4 zonas","EE.UU., Reino Unido y Francia al oeste; la URSS al este. Berlín también se dividió en cuatro."],["✈️","Puente aéreo","1948: la URSS bloqueó Berlín Occidental. Los aliados la abastecieron por aire casi un año: comida, carbón y medicinas."],["🏃","La fuga","Millones de alemanes orientales huían al Oeste buscando libertad y mejores condiciones de vida."]]},
 {k:"wall",say:"1961: el Este quiere frenar la fuga. Levanta el muro, ladrillo por ladrillo.",end:"El 13 de agosto de 1961 empezaron con alambre de púas en una sola noche; luego vino el concreto. Duró hasta 1989 y fue el símbolo de un mundo dividido."},
 {k:"quiz",say:"Mini-reto:",p:"¿Para qué se construyó el Muro de Berlín?",o:["Para frenar la huida de alemanes orientales hacia el Oeste","Para frenar una invasión de la OTAN","Para dividir dos barrios en disputa"],c:0,hint:"Pista: ¿quién se estaba yendo, y hacia dónde?",e:"Era un muro para que la gente del Este no pudiera salir."}]},
{id:7,ic:"🪖",n:"Corea y Vietnam",y:"1950–1975",
 learn:["Las superpotencias pelearon «por poderes»: apoyando a bandos de otros países.","Corea quedó dividida tras la guerra (1950–53) y sigue así hasta hoy.","EE.UU. se retiró de Vietnam en 1973 y el país se unificó bajo el Norte comunista en 1975."],
 sc:[
 {k:"time",say:"Las potencias no chocaban de frente, pero sí hubo guerras reales. Desliza el tiempo.",min:1950,max:1975,ev:[[1950,"⚔️","Guerra de Corea: el Norte (apoyado por la URSS y China) ataca al Sur (apoyado por EE.UU. y la ONU)."],[1951,"🇨🇴","Llega a Corea el Batallón Colombia: el único país latinoamericano que envió tropas."],[1953,"🤝","Armisticio: Corea queda dividida cerca del paralelo 38."],[1965,"🪖","EE.UU. envía tropas de combate a Vietnam."],[1973,"🕊️","EE.UU. retira sus tropas de Vietnam."],[1975,"🏁","Cae Saigón: Vietnam queda unificado bajo el Norte comunista."]]},
 {k:"swipe",say:"Misión de campo: ¿a qué bloque pertenecía o a quién apoyaba cada uno?",i:[["Corea del Sur",0,"Contaba con EE.UU. y la ONU.","Seúl era aliada de Occidente"],["Corea del Norte",1,"Apoyada por la URSS y China.","era el bando comunista"],["China (1950)",1,"Envió cientos de miles de soldados a ayudar a Corea del Norte.","era comunista desde 1949"],["Colombia",0,"Envió el Batallón Colombia a luchar junto a la ONU.","luchó al lado de EE.UU. y la ONU"],["Vietnam del Sur",0,"Recibió el respaldo de EE.UU.","Washington lo apoyó"],["Vietnam del Norte",1,"Apoyado por el bloque comunista.","era el bando comunista"]]},
 {k:"quiz",say:"Mini-reto:",p:"¿Por qué se llaman «guerras por poderes»?",o:["Porque las superpotencias apoyaban a bandos locales sin chocar de frente","Porque se peleaban con poderes mágicos","Porque eran guerras directas EE.UU.–URSS"],c:0,hint:"Pista: ¿quién ponía los soldados y quién ponía el apoyo?",e:"Así las superpotencias se disputaban influencia sin una guerra directa entre ellas."}]},
{id:3,ic:"🚀",n:"La carrera espacial",y:"1957–1975",
 learn:["La URSS se adelantó con el Sputnik (1957), la perrita Laika y Yuri Gagarin (1961).","EE.UU. respondió creando la NASA (1958) y llegó a la Luna en 1969.","En 1975 las dos potencias cooperaron por primera vez en el espacio (Apolo-Soyuz)."],
 sc:[
 {k:"hot",say:"Como no podían pelear de frente, compitieron en todo: armas… y el espacio. Toca los hitos.",h:[["🛰️","Sputnik","1957: la URSS lanza el primer satélite artificial. EE.UU. se asusta: ¡iban adelante!"],["🐕","Laika","1957: esta perrita soviética fue el primer ser vivo en orbitar la Tierra."],["🏛️","NASA","1958: EE.UU. crea su agencia espacial para alcanzar a los soviéticos."],["🌕","Apolo 11","1969: Neil Armstrong y Buzz Aldrin caminan sobre la Luna."]]},
 {k:"launch",say:"Diriges el lanzamiento del Sputnik. ¡Necesita la potencia justa!",end:"¡Despegue! El Sputnik 1 salió el 4 de octubre de 1957. Su «bip-bip» por radio se escuchó en todo el mundo y estremeció a EE.UU."},
 {k:"time",say:"Desliza y mira cómo cada logro obligaba al otro a responder.",min:1957,max:1975,ev:[[1957,"🛰️","Sputnik: la URSS arranca ganando."],[1961,"👨‍🚀","Yuri Gagarin, primer humano en el espacio. Kennedy promete llegar a la Luna."],[1963,"👩‍🚀","Valentina Tereshkova, soviética, primera mujer en el espacio."],[1969,"🌕","Apolo 11: EE.UU. llega a la Luna."],[1975,"🤝","Misión Apolo-Soyuz: ¡por primera vez cooperan en el espacio!"]]},
 {k:"quiz",say:"Mini-reto:",p:"Cuando la URSS lanzó el Sputnik, EE.UU. reaccionó…",o:["Acelerando su programa espacial","Ignorándolo","Cancelando sus cohetes"],c:0,hint:"Pista: ¡era una competencia!",e:"En 1958 nació la NASA y la meta pasó a ser la Luna."}]},
{id:4,ic:"☢️",n:"Cuba y la crisis de los misiles",y:"1959–1962",
 learn:["En 1959 triunfó la Revolución cubana y Cuba se acercó a la URSS.","En 1962 la URSS instaló misiles en Cuba: el mundo estuvo 13 días al borde de una guerra nuclear.","La crisis se resolvió negociando, y luego se creó una línea directa Washington–Moscú."],
 sc:[
 {k:"time",say:"La Guerra Fría llegó al Caribe. Desliza para ver cómo se calentó Cuba.",min:1959,max:1962,ev:[[1959,"🇨🇺","Triunfa la Revolución cubana: Fidel Castro llega al poder."],[1960,"🤝","Cuba se acerca a la URSS: le vende azúcar y recibe petróleo."],[1961,"🏖️","Bahía de Cochinos: fracasa una invasión de exiliados cubanos apoyada por EE.UU."],[1962,"🚀","La URSS instala en secreto misiles nucleares en Cuba."]]},
 {k:"hot",say:"Octubre de 1962. Tú eres el presidente de EE.UU. Revisa el informe secreto.",h:[["📸","Foto espía","Un avión U-2 fotografía rampas de misiles soviéticos en Cuba."],["📏","Muy cerca","Cuba está a unos 150 km de Florida. Los misiles llegarían en minutos."],["⚠️","Riesgo","Un error y podía empezar una guerra nuclear."]]},
 {k:"def",say:"Decide con cabeza fría y vigila el nivel DEFCON.",steps:[{p:"¿Qué haces primero?",o:[["💥 Invadir Cuba ya",30,"Había tropas soviéticas allí: la tensión se dispara. Prueba otra opción.",0],["🚢 Bloqueo naval («cuarentena») y exigir la retirada",-10,"¡Eso se hizo! Firmeza sin disparar, y deja espacio para negociar.",1],["😴 No hacer nada",15,"Tolerar misiles tan cerca era inaceptable para EE.UU. Hay que actuar.",0]]},{p:"Jrushchov ofrece retirar los misiles si EE.UU. no invade Cuba. ¿Y ahora?",o:[["🤝 Aceptar (y retirar en secreto los misiles de EE.UU. en Turquía)",-30,"¡Así terminó! Ambos salvaron la cara y el mundo respiró.",1],["😤 Exigir rendición total",25,"Cierras la salida pacífica. Intenta de nuevo.",0]]}]},
 {k:"quiz",say:"Mini-reto:",p:"¿Cómo se resolvió la crisis de los misiles?",o:["Negociando: la URSS retiró los misiles y EE.UU. prometió no invadir Cuba","Con una guerra nuclear","Con una invasión a Cuba"],c:0,hint:"Pista: nadie quería apretar el botón.",e:"En 1963 se creó una línea directa (el famoso «teléfono rojo») entre Washington y Moscú."}]},
{id:6,ic:"🕵️",n:"Espías y propaganda",y:"1947–1991",
 learn:["La disuasión nuclear (MAD) evitaba la guerra directa: nadie podía ganar.","La CIA (EE.UU.) y la KGB (URSS) espiaban y usaban códigos secretos.","Ambos bandos usaban propaganda para convencer al mundo de que eran los buenos."],
 sc:[

  if(e&&e!==lastE){lastE=e;const em=$("#em");em.textContent=e[1];em.classList.remove("pop");void em.offsetWidth;em.classList.add("pop");$("#bx").innerHTML=`<div class="dz-h">${e[0]}</div><p>${e[2]}</p>`}

 $("#st").innerHTML=`<div class="w100"><div class="wire" id="wr"></div><div class="wall">${"<b></b>".repeat(n)}</div><div class="wall-lab"><span>🧱 Muro: <b id="wp">0%</b></span><span>Berlín, 1961</span></div></div>`;

  if(c===12){$("#cw").textContent="🙌 🧍 🎉 🧍 🙌";$("#bx").innerHTML=`<p>🔨 Los berlineses subieron al muro con martillos y cinceles. ¡Las familias se reencontraban después de 28 años!</p>`}
  if(c>=n){$("#bt").disabled=true;$("#cw").textContent="🎉 🙌 🥳 🙌 🎉";$("#bx").innerHTML=`<p>${s.end}</p>`;gain(8);conf();un()}}};

K.def=s=>{let base=70,i=0;const cl=v=>Math.max(3,Math.min(97,v));
 $("#st").innerHTML=`<div class="w100 c"><div class="defcon" id="dc"></div><div class="mt"><div id="nd">☢️</div></div><div class="mt-lab"><span>Calma</span><span>Tensión nuclear</span><span>Guerra</span></div></div>`;
 const paint=v=>{$("#nd").style.left=v+"%";const d=v>85?1:v>65?2:v>45?3:v>25?4:5;$("#dc").className="defcon d"+d;$("#dc").innerHTML=`DEFCON <b>${d}</b>`};paint(base);
 const step=()=>{const t=s.steps[i];
  $("#ix").innerHTML=`<h3 class="q">${t.p}</h3>${t.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="lt">${j+1}</span>${o[0]}</button>`).join("")}${box(i===0?"DEFCON 2 fue el nivel de alerta más alto que EE.UU. alcanzó en toda su historia. Elige con cuidado, presidente.":"Elige con cuidado, presidente.")}`;
  $$("#ix .opt").forEach(b=>b.onclick=()=>{const o=t.o[+b.dataset.j];$("#bx").innerHTML=`<p>${o[2]}</p>`;
   if(o[3]){base=cl(base+o[1]);paint(base);$$("#ix .opt").forEach(x=>x.disabled=true);b.classList.add("ok");okFx();gain(8);i++;
    if(i<s.steps.length){$("#bx").insertAdjacentHTML("beforeend",`<button class="btn" id="nd2">Siguiente decisión ▶</button>`);$("#nd2").onclick=step}
    else{$("#bx").insertAdjacentHTML("beforeend",`<p><b>🕊️ Crisis superada.</b> Fueron 13 días con el mundo al borde de una guerra nuclear.</p>`);un()}}
   else{paint(cl(base+o[1]));later(()=>paint(base),1400);b.classList.add("no");shake(b);b.disabled=true;miss()}})};
 step()};

K.quiz=s=>{let w=0;const o=shuffle(s.o.map((t,i)=>({t,i})));$("#st").classList.add("sm");
 $("#st").innerHTML=`<div class="em">❓</div><div class="kicker light">Mini-reto</div>`;
 $("#ix").innerHTML=`<h3 class="q">${s.p}</h3>${o.map((x,j)=>`<button class="opt" data-i="${x.i}"><span class="lt">${"ABC"[j]}</span>${x.t}</button>`).join("")}${box("Elige una respuesta (o usa las teclas 1, 2, 3).")}`;
 $$("#ix .opt").forEach(b=>b.onclick=()=>{if(+b.dataset.i===s.c){$$("#ix .opt").forEach(x=>x.disabled=true);b.classList.add("ok");okFx();gain(w?5:12);if(!w)S.fq++;save();$("#bx").innerHTML=`<p>✅ ${w?"¡Eso es!":"¡Exacto, al primer intento!"} ${s.e}</p>`;un()}
  else{w=1;b.disabled=true;b.classList.add("no");shake(b);miss();$("#bx").innerHTML=`<p>💡 ${s.hint}</p>`}})};

K.swipe=s=>{let i=0,busy=false,x0=null,dx=0;
 $("#st").innerHTML=`<div class="sw-wrap"><div class="sw-side">⬅<br>🇺🇸</div><div class="cd" id="cd"></div><div class="sw-side">➡<br>🇷🇺</div></div><div class="sw-count" id="swc"></div>`;
 $("#ix").innerHTML=`<div class="sw"><button class="btn blue" data-s="0">🇺🇸 EE.UU.</button><button class="btn red" data-s="1">🇷🇺 URSS</button></div>${box("Arrastra la tarjeta a un lado, usa los botones o las flechas ⬅ ➡ del teclado.")}`;
 const cd=$("#cd");
 const show=()=>{cd.className="cd in";cd.style.transform="";cd.textContent=s.i[i][0];$("#swc").textContent=`Tarjeta ${i+1} de ${s.i.length}`};show();
 const pick=side=>{if(busy||i>=s.i.length)return;const c=s.i[i];
  if(side===c[1]){busy=true;okFx();gain(4);$("#bx").innerHTML=`<p>✅ <b>${c[0]}</b> → ${side?"URSS":"EE.UU."}. ${c[2]}</p>`;cd.style.transform="";cd.className="cd out"+(side?"R":"L");i++;
   later(()=>{busy=false;if(i<s.i.length)show();else{cd.className="cd in static";cd.textContent="🎉 ¡Todas clasificadas!";$("#swc").textContent="";$$(".sw .btn").forEach(b=>b.disabled=true);un()}},380)}
  else{miss();cd.style.transform="";shake(cd);$("#bx").innerHTML=`<p>💡 Pista: ${c[3]}${c[3].endsWith(".")?"":"."}</p>`}};
 $$(".sw .btn").forEach(b=>b.onclick=()=>pick(+b.dataset.s));
 cd.onpointerdown=e=>{if(busy||i>=s.i.length)return;x0=e.clientX;dx=0;cd.setPointerCapture(e.pointerId);cd.classList.add("drag")};
 cd.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;cd.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;cd.dataset.tilt=dx<-30?"l":dx>30?"r":""};
 cd.onpointerup=cd.onpointercancel=()=>{if(x0===null)return;x0=null;cd.classList.remove("drag");cd.dataset.tilt="";if(Math.abs(dx)>70)pick(dx<0?0:1);else cd.style.transform=""}};

K.launch=s=>{let p=0,d=1.25,done=false;
 $("#st").innerHTML=`<div class="sky" id="sky"><div class="starfield"></div><div class="rocket" id="rk">🚀</div><div class="pad"></div><div class="cdn" id="cdn"></div></div><div class="w100"><div class="nl"><div class="z"></div><div class="p" id="pn"></div></div><div class="mt-lab"><span>Poca</span><span>Potencia</span><span>Demasiada</span></div></div>`;
 $("#ix").innerHTML=`<button class="btn big" id="bt">🔥 ¡Encender motores!</button>${box("Toca cuando la aguja blanca esté en la zona verde.")}`;
 every(()=>{if(done)return;p+=d;if(p>=100||p<=0){d=-d;p=Math.max(0,Math.min(100,p))}$("#pn").style.left=p+"%"},16);
 $("#bt").onclick=()=>{if(done)return;
  if(p>=38&&p<=62){done=true;$("#bt").disabled=true;okFx();let c=3;const cdn=$("#cdn");cdn.textContent=c;SFX.beep();$("#bx").innerHTML=`<p>✅ ¡Potencia perfecta! Cuenta regresiva…</p>`;
   const t=every(()=>{c--;if(c>0){cdn.textContent=c;SFX.beep()}else{clearInterval(t);cdn.textContent="¡Despegue!";SFX.launch();$("#rk").classList.add("go");gain(8);$("#bx").innerHTML=`<p>${s.end}</p>`;un()}},650)}
  else{miss();d=Math.sign(d)*Math.max(.55,Math.abs(d)*.8);$("#bx").innerHTML=`<p>💥 ${p<38?"Poca potencia: el cohete no sube.":"¡Demasiada potencia! Los motores se sobrecalientan."} Inténtalo otra vez (la aguja irá más lenta).</p>`;shake($("#sky"))}}};

K.cipher=s=>{const E=(x,n)=>x.replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65+n+260)%26+65)),enc=E(s.w,s.sh);let done=false;

 $("#st").innerHTML=`<div class="w100 c"><div class="kicker light">🔒 Mensaje interceptado</div><div class="cipher" id="cp">${draw(enc)}</div></div>`;
 $("#ix").innerHTML=`${box("Cada letra se corrió varios puestos en el abecedario (A→B→C…). Gira el dial hasta que el mensaje tenga sentido.","")}<div class="dial"><button class="btn sq" id="dm" aria-label="Girar a la izquierda">−</button><input type="range" id="rg" min="0" max="25" value="0" aria-label="Dial"><button class="btn sq" id="dp" aria-label="Girar a la derecha">+</button></div><div class="c mut" id="dv">Dial: 0</div>`;
 const rg=$("#rg"),upd=()=>{if(done)return;const v=+rg.value,d=E(enc,-v);$("#cp").innerHTML=draw(d);$("#dv").textContent="Dial: "+v;
  if(d===s.w){done=true;[rg,$("#dm"),$("#dp")].forEach(x=>x.disabled=true);$("#cp").classList.add("solved");okFx();gain(8);$("#bx").innerHTML=`<p>🔓 ${s.end}</p>`;un()}};
 rg.oninput=upd;$("#dm").onclick=()=>{rg.value=(+rg.value+25)%26;upd()};$("#dp").onclick=()=>{rg.value=(+rg.value+1)%26;upd()};
 later(()=>{if(!done)$("#bx").innerHTML=`<p>💡 Pista de la central: el número secreto está entre 5 y 9.</p>`},15000)};

K.order=s=>{let n=0;const N=[...s.i].sort((a,b)=>a[1]-b[1]);

  else{miss();shake(b);b.classList.add("no");setTimeout(()=>b.classList.remove("no"),450);$("#bx").innerHTML=`<p>💡 «${b.textContent}» pasó en otro momento. ¿Cuál vino antes?</p>`}})};

K.match=s=>{let L=null,R=null,n=0;
 $("#st").classList.add("sm");
 $("#st").innerHTML=`<div class="w100 c"><div class="em">🧩</div><div class="kicker light">Parejas unidas: <b id="mc">0</b>/${s.p.length}</div><div class="mprog"><i id="mp"></i></div></div>`;

 const tryPair=()=>{if(!L||!R)return;

   $("#bx").innerHTML=`<p>✅ <b>${s.p[k][0]}</b>: ${s.p[k][1]}.</p>`;if(n===s.p.length){$("#bx").insertAdjacentHTML("beforeend","<p>🧩 ¡Todas las parejas unidas!</p>");un()}}

  L=R=null};

K.tf=s=>{let i=0,t0=0,lock=false;const T=9000;
 $("#st").innerHTML=`<div class="w100"><div class="kicker light c" style="margin-bottom:10px">🕵️ ¿Verdad o propaganda?</div><div class="cd static" id="cd"></div><div class="timer"><i id="tmr"></i></div><div class="sw-count" id="tfc" style="margin-top:6px"></div></div>`;
 $("#ix").innerHTML=`<div class="sw"><button class="btn green" data-a="1">✅ Verdad</button><button class="btn red" data-a="0">🚫 Falso</button></div>${box("Responde antes de que se vacíe la barra para ganar ⚡ extra.")}`;
 const bar=()=>$("#tmr");
 const show=()=>{lock=false;const q=s.q[i],cd=$("#cd");cd.className="cd static in";cd.textContent=q[0];$("#tfc").textContent=`Afirmación ${i+1} de ${s.q.length}`;t0=performance.now();
  const b=bar();b.style.transition="none";b.style.width="100%";void b.offsetWidth;b.style.transition=`width ${T}ms linear`;b.style.width="0%";$$(".sw .btn").forEach(x=>x.disabled=false);$("#bx").innerHTML=`<p class="mut">¿Verdad o falso?</p>`};
 $$(".sw .btn").forEach(b=>b.onclick=()=>{if(lock)return;const q=s.q[i];
  if(+b.dataset.a===q[1]){lock=true;$$(".sw .btn").forEach(x=>x.disabled=true);const fast=performance.now()-t0<T,br=bar(),w=getComputedStyle(br).width;br.style.transition="none";br.style.width=w;okFx();gain(fast?5:3);
   $("#bx").innerHTML=`<p>✅ ${fast?"<b>¡Rápido!</b> ":""}${q[2]}</p>`;i++;
   if(i<s.q.length){$("#bx").insertAdjacentHTML("beforeend",`<button class="btn" id="tfn">Siguiente afirmación ▶</button>`);$("#tfn").onclick=show}
   else{$("#cd").textContent="🔍 ¡Detector de mentiras superado!";$("#tfc").textContent="";un()}}
  else{miss();b.disabled=true;shake($("#cd"));$("#bx").innerHTML=`<p>💡 Mmm… piénsalo otra vez. ${q[3]}</p>`}});
 show()};

function tgSnd(b){S.snd=S.snd?0:1;save();if(b)b.textContent=S.snd?"🔊 Sonido":"🔇 Sin sonido";if(S.snd)SFX.ok()}
function resetAll(){if(!confirm("¿Borrar todo tu progreso? Esta acción no se puede deshacer."))return;S=Object.assign(fresh(),{snd:S.snd,theme:S.theme,name:S.name,intro:1,dy:S.dy,ld:S.ld});save();home();toast("Progreso reiniciado")}
function shr(){const t=`Completé «Guerra Fría: La Gran Misión» 🕶️ Puntaje: ${N(calc().total)} (${calc().g[0]}) · Rango: ${rank().n} ${rank().i} · ${S.xp} XP · ⭐ ${totalStars()}/${M.length*3}${S.exam?" · Examen "+S.exam+"/10":""}`;
 if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast("📋 Copiado: ya puedes pegarlo"),()=>toast(t));else toast(t)}
addEventListener("pointerdown",e=>{PX=e.clientX;PY=e.clientY},true);
document.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&!b.disabled){SFX.tap();if(e.detail===0){const r=b.getBoundingClientRect();PX=r.left+r.width/2;PY=r.top}}},true);
addEventListener("keydown",e=>{if(e.target.closest("input,textarea")||e.ctrlKey||e.metaKey||e.altKey)return;
 const n=parseInt(e.key,10);if(n>=1&&n<=9){const b=$$("#app .opt")[n-1];if(b&&!b.disabled){b.focus();b.click()}return}
 if(e.key==="ArrowLeft"||e.key==="ArrowRight"){const sw=$$(".sw .btn");if(sw.length===2){e.preventDefault();sw[e.key==="ArrowLeft"?0:1].click()}}});
(()=>{const d=new Date().toDateString();if(S.ld!==d){const y=new Date(Date.now()-864e5).toDateString();S.dy=S.ld===y?(S.dy||0)+1:1;S.ld=d;save()}})();
home();checkMedals();
</script>
